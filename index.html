<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>صورة إلى فيديو</title>
<style>
:root{
  --bg:#eef1ef; --card:#ffffff; --ink:#15262c; --muted:#5d6e73;
  --line:#cdd6d3; --accent:#0b6b63; --accent-ink:#ffffff; --err:#b3261e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1a1d; --card:#17262a; --ink:#e7efed; --muted:#98aaad;
        --line:#2b3f44; --accent:#3fc4b6; --accent-ink:#06211e; --err:#ff8a80;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);
  font:17px/1.6 "Geeza Pro","Noto Naskh Arabic",system-ui,sans-serif;
  padding:16px}
main{max-width:520px;margin:0 auto;display:grid;gap:16px}
h1{font-size:1.5rem;margin:8px 0 0}
p.sub{margin:0;color:var(--muted);font-size:.95rem}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
label{font-weight:600}
input[type=text],input[type=password],textarea{
  width:100%;font:inherit;color:var(--ink);background:transparent;
  border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:110px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px;
  background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.5}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
#pick{display:grid;place-items:center;min-height:150px;border:2px dashed var(--line);border-radius:12px;color:var(--muted);cursor:pointer;overflow:hidden}
#pick img{width:100%;display:block}
#file{display:none}
#status{min-height:1.6em;color:var(--muted)}
#status.err{color:var(--err)}
video{width:100%;border-radius:12px;background:#000}
a.dl{display:block;text-align:center;padding:12px;border:1px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none;font-weight:600}
details summary{cursor:pointer;font-weight:600}
details>div{display:grid;gap:10px;margin-top:10px}
small{color:var(--muted)}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <header>
    <h1>صورة إلى فيديو</h1>
    <p class="sub">اختار صورة، اكتب وصف الحركة، واضغط توليد.</p>
  </header>

  <section>
    <details id="settings">
      <summary>الإعدادات (مرة وحدة بس)</summary>
      <div>
        <label for="key">مفتاح fal.ai</label>
        <input id="key" type="password" dir="ltr" placeholder="الصق المفتاح هون" autocomplete="off">
        <label for="model">النموذج</label>
        <input id="model" type="text" dir="ltr" value="fal-ai/ltx-video/image-to-video">
        <small>المفتاح بيتخزن على جهازك بس.</small>
        <button class="ghost" id="saveSet" type="button">حفظ الإعدادات</button>
      </div>
    </details>
  </section>

  <section>
    <label for="file">الصورة</label>
    <div id="pick" role="button" tabindex="0">اضغط لاختيار صورة</div>
    <input id="file" type="file" accept="image/*">

    <label for="prompt">وصف الحركة</label>
    <textarea id="prompt" placeholder="مثال: الكاميرا تقرّب ببطء، والشعر يتحرك مع الهواء"></textarea>

    <button id="go" type="button">توليد الفيديو</button>
    <div id="status" role="status" aria-live="polite"></div>
  </section>

  <section id="out" class="hidden">
    <video id="vid" controls playsinline loop></video>
    <a id="dl" class="dl" target="_blank" rel="noopener">فتح الفيديو وحفظه</a>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let imageData = null;

function store(get, k, v){
  try { return get ? localStorage.getItem(k) : localStorage.setItem(k, v); }
  catch(e){ return null; }
}

// load saved settings
const savedKey = store(true, 'fal_key');
const savedModel = store(true, 'fal_model');
if (savedKey) $('key').value = savedKey; else $('settings').open = true;
if (savedModel) $('model').value = savedModel;

$('saveSet').onclick = () => {
  store(false, 'fal_key', $('key').value.trim());
  store(false, 'fal_model', $('model').value.trim());
  setStatus('تم حفظ الإعدادات.');
  $('settings').open = false;
};

function setStatus(t, err){ const s = $('status'); s.textContent = t; s.className = err ? 'err' : ''; }

// pick + shrink image (keeps upload small and fast)
$('pick').onclick = () => $('file').click();
$('pick').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') $('file').click(); };
$('file').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const img = new Image();
  img.onload = () => {
    const max = 1024, r = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    imageData = c.toDataURL('image/jpeg', 0.9);
    $('pick').innerHTML = '';
    const p = new Image(); p.src = imageData; p.alt = 'الصورة المختارة';
    $('pick').appendChild(p);
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(f);
};

const sleep = ms => new Promise(r => setTimeout(r, ms));

$('go').onclick = async () => {
  const key = $('key').value.trim();
  const model = $('model').value.trim();
  const prompt = $('prompt').value.trim();
  if (!key){ $('settings').open = true; return setStatus('حط مفتاح fal.ai بالإعدادات أول.', true); }
  if (!imageData) return setStatus('اختار صورة أول.', true);
  if (!prompt) return setStatus('اكتب وصف للحركة.', true);

  const headers = { 'Authorization': 'Key ' + key, 'Content-Type': 'application/json' };
  $('go').disabled = true; $('out').classList.add('hidden');

  try {
    setStatus('عم يرسل الطلب...');
    const sub = await fetch('https://queue.fal.run/' + model, {
      method: 'POST', headers,
      body: JSON.stringify({ prompt, image_url: imageData })
    });
    if (!sub.ok) throw new Error(await explain(sub));
    const job = await sub.json();

    const t0 = Date.now();
    while (true){
      await sleep(3000);
      const st = await fetch(job.status_url, { headers });
      if (!st.ok) throw new Error(await explain(st));
      const s = await st.json();
      const secs = Math.round((Date.now() - t0) / 1000);
      if (s.status === 'COMPLETED') break;
      setStatus((s.status === 'IN_QUEUE' ? 'بالدور... ' : 'عم يولّد الفيديو... ') + secs + ' ثانية');
      if (secs > 600) throw new Error('طوّلت العملية. جرب مرة تانية.');
    }

    const res = await fetch(job.response_url, { headers });
    if (!res.ok) throw new Error(await explain(res));
    const data = await res.json();
    const url = data.video && data.video.url;
    if (!url) throw new Error('ما رجع فيديو من الخدمة.');

    $('vid').src = url; $('dl').href = url;
    $('out').classList.remove('hidden');
    setStatus('جاهز.');
    $('out').scrollIntoView({ behavior: 'smooth' });
  } catch (e) {
    setStatus(e.message || 'صار خطأ.', true);
  } finally {
    $('go').disabled = false;
  }
};

async function explain(resp){
  if (resp.status === 401 || resp.status === 403) return 'المفتاح غلط أو الرصيد خلصان.';
  if (resp.status === 422) return 'النموذج رفض الطلب. جرب صورة تانية أو وصف أقصر.';
  let t = ''; try { t = (await resp.text()).slice(0, 160); } catch(e){}
  return 'خطأ ' + resp.status + ' ' + t;
}
</script>
</body>
</html>
